# Receives remote syslog (the EdgeRouter) on UDP 514 and writes it to the
# journal, see docs/syslog.md. This replaces the stock config, whose imjournal
# input copies the whole journal into /var/log.

module(load="imudp")
module(load="omjournal")

input(type="imudp" port="514")

# omjournal drops variables referenced from a list template.
template(name="journal" type="subtree" subtree="$!journal")

# The sender's hostname as the identifier keeps its sudo, cron and so on apart
# from the host's own under journalctl -t.
set $!journal!SYSLOG_IDENTIFIER = $hostname;
set $!journal!MESSAGE = $programname & ": " & ltrim($msg);
set $!journal!PRIORITY = $syslogseverity;
set $!journal!SYSLOG_FACILITY = $syslogfacility;
action(type="omjournal" template="journal")
