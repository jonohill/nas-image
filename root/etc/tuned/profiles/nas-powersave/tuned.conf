[main]
summary=powersave plus SATA min_power and PCI runtime PM for the NAS
include=powersave

# min_power can drop the link to spinning drives. If they log link errors
# after storage is added, use med_power_with_dipm.
[scsi_host]
alpm=min_power

[pci_runtime_pm]
type=script
script=${i:PROFILE_DIR}/pci-runtime-pm.sh
