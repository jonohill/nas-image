# Seeded into /config on first start. Home Assistant owns it after that.
default_config:

# Requests arrive through cloudflared on the host loopback. Without this
# Home Assistant answers proxied requests with 400.
http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 127.0.0.1
    - ::1

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
