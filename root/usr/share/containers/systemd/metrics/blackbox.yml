# Targets and intervals are in scrape.yml. Modules are IPv4 only because the
# upstream link has no IPv6.
modules:
  # The name's 5 s TTL keeps the router's cache from answering most probes.
  dns_udp:
    prober: dns
    timeout: 5s
    dns:
      transport_protocol: udp
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      query_name: dynamodb.ap-southeast-2.amazonaws.com
      query_type: A
      validate_answer_rrs:
        fail_if_none_matches_regexp: ['\tIN\tA\t']
  dns_tcp:
    prober: dns
    timeout: 5s
    dns:
      transport_protocol: tcp
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      query_name: dynamodb.ap-southeast-2.amazonaws.com
      query_type: A
      validate_answer_rrs:
        fail_if_none_matches_regexp: ['\tIN\tA\t']

  tcp_connect:
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false

  # 1472 bytes of payload makes a 1500-byte packet. Linux sets DF on
  # unprivileged ping sockets, so an MTU black hole shows as loss.
  # dont_fragment would need a raw socket.
  icmp_1500:
    prober: icmp
    timeout: 5s
    icmp:
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      payload_size: 1472

  # A redirect passes rather than probing a second host.
  https:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      fail_if_not_ssl: true
      follow_redirects: false
      # Cloudflare's bot challenge 403s www.ecosia.org without it
      headers:
        Accept: '*/*'
      valid_status_codes: [200, 204, 301]

  # 32 KiB spans enough full-size segments to hit an MTU black hole.
  # body_size_limit fails the probe if a server ignores Range.
  download:
    prober: http
    timeout: 15s
    http:
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      fail_if_not_ssl: true
      headers:
        Range: bytes=0-32767
      valid_status_codes: [200, 206]
      body_size_limit: 64KiB

  # Fails where UDP 443 is dropped but TCP isn't.
  http3:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      enable_http3: true
      enable_http2: false
      valid_http_versions: [HTTP/3.0]
